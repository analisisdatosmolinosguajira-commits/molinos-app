<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2563eb;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#3b82f6;stop-opacity:1" />
    </linearGradient>
  </defs>
  <!-- Background circle -->
  <circle cx="50" cy="50" r="48" fill="url(#grad1)" />
  <!-- Mill structure -->
  <rect x="45" y="40" width="10" height="45" rx="2" fill="#ffffff" />
  <path d="M50 35 L75 85 L25 85 Z" fill="#ffffff" opacity="0.2" />
  <!-- Blades -->
  <g transform="translate(50, 40)">
    <animateTransform attributeName="transform" type="rotate" from="0 50 40" to="360 50 40" dur="10s" repeatCount="indefinite" />
    <path d="M50 40 L50 15 Q55 10 60 15 Z" fill="#ffffff" />
    <path d="M50 40 L75 40 Q80 45 75 50 Z" fill="#ffffff" />
    <path d="M50 40 L50 65 Q45 70 40 65 Z" fill="#ffffff" />
    <path d="M50 40 L25 40 Q20 35 25 30 Z" fill="#ffffff" />
  </g>
  <!-- Center point -->
  <circle cx="50" cy="40" r="4" fill="#1e3a8a" />
</svg>
